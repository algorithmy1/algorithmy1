<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="640" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Abdallah Terrab — Data Engineer and Data Architect</title>
  <desc id="desc">A high-resolution transparent profile banner with crisp light text, a dark vector outline and a connected-data pattern.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53d8fb"/>
      <stop offset="1" stop-color="#69f0c0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g opacity="0.2" stroke="#78d9ef" stroke-width="1.5" fill="none">
    <path d="M820 55 L935 105 L1060 60 L1140 135 L1035 205 L1125 270"/>
    <path d="M790 210 L900 165 L1035 205 L975 285"/>
    <path d="M935 105 L900 165 L790 115 L820 55"/>
  </g>
  <g fill="#69f0c0" filter="url(#glow)">
    <circle cx="820" cy="55" r="4"/>
    <circle cx="935" cy="105" r="5"/>
    <circle cx="1060" cy="60" r="4"/>
    <circle cx="1140" cy="135" r="5"/>
    <circle cx="1035" cy="205" r="5"/>
    <circle cx="1125" cy="270" r="4"/>
    <circle cx="790" cy="210" r="4"/>
    <circle cx="900" cy="165" r="5"/>
    <circle cx="975" cy="285" r="4"/>
    <circle cx="790" cy="115" r="4"/>
  </g>

  <rect x="70" y="73" width="78" height="6" rx="3" fill="url(#accent)"/>
  <text x="70" y="145" fill="#f3f8fb" stroke="#06131d" stroke-width="2.6" stroke-opacity="0.9" stroke-linejoin="round" paint-order="stroke fill" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">
    Abdallah Terrab
  </text>
  <text x="72" y="195" fill="#a9c6d8" stroke="#06131d" stroke-width="1.8" stroke-opacity="0.9" stroke-linejoin="round" paint-order="stroke fill" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" letter-spacing="1">
    DATA ENGINEER  ·  DATA ARCHITECT
  </text>
  <text x="72" y="244" fill="#69f0c0" stroke="#06131d" stroke-width="1.4" stroke-opacity="0.9" stroke-linejoin="round" paint-order="stroke fill" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    reliable platforms · intelligent products · observable systems
  </text>
</svg>
